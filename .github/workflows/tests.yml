name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: bash scripts/setup.sh
      - name: Import analysis dependencies
        run: .venv/bin/python -c "import numpy, matplotlib, sxs, qnmfinder, scri"
      - name: Test
        run: .venv/bin/python -m pytest
